<link rel="canonical" href="https://example.com/converter.html">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">Everyday Calculator</a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>

    <div class="nav-right">
      <button class="icon-btn" id="theme-toggle" type="button">Dark mode</button>
    </div>

</header>

<main id="main">
  <div class="container">
    <h1>Unit Converter</h1>
    <p class="lede">Convert between common units of measurement. The result updates as you type.</p>

    <div class="tab-list" role="tablist" aria-label="Unit category" id="category-tabs"></div>

    <div class="panel">
      <div class="converter-row">
        <div class="field">
          <label for="from-value">Amount</label>
          <input type="text" inputmode="decimal" id="from-value" value="1">
        </div>
        <button type="button" class="swap-btn" id="swap-units" aria-label="Swap units">⇄</button>
        <div class="field">
          <label for="to-value">Result</label>
          <input type="text" id="to-value" readonly>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="from-unit">From</label>
          <select id="from-unit"></select>
        </div>
        <div class="field">
          <label for="to-unit">To</label>
          <select id="to-unit"></select>
        </div>
      </div>
      <div id="converter-error" class="result-box error" hidden></div>
    </div>
  </div>
</main>
